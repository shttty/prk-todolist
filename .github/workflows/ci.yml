name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pi: 0.82.1
            typebox: 1.1.38
          - pi: 0.84.1
            typebox: 1.3.7

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: npm ci --include=dev

      - name: Select Pi host version
        run: npm install --include=dev --no-save --package-lock=false @earendil-works/pi-coding-agent@${{ matrix.pi }} typebox@${{ matrix.typebox }}

      - name: TypeScript tests
        env:
          EXPECTED_PI_VERSION: ${{ matrix.pi }}
        run: npm test

      - name: TypeScript check
        run: npm run check

      - name: Python tests
        run: python3 -m unittest discover -s tests/python -p 'test_*.py' -v

      - name: Package contents
        run: npm pack --dry-run